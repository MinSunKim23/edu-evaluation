<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · 교육평가</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23faf8f3'/%3E%3Cpath d='M26 30h48M26 50h48M26 70h30' stroke='%23c1613c' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{--bg:#faf8f3;--card:#fff;--line:#e9e3d7;--clay:#c1613c;--ink:#26241f;--muted:#7a7266}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);padding:24px;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.75}
  .box{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:40px 44px;max-width:520px;box-shadow:0 2px 10px rgba(38,36,31,.03);text-align:center}
  .code{font-size:.85rem;letter-spacing:.08em;color:var(--clay);font-weight:700;margin:0 0 10px}
  h1{margin:0 0 12px;font-size:1.6rem;letter-spacing:-.01em}
  p{margin:0 0 24px;color:var(--muted);font-size:.95rem}
  a{display:inline-block;background:var(--clay);color:#fff;text-decoration:none;
    border-radius:999px;padding:11px 24px;font-weight:600;font-size:.92rem}
  a:hover{opacity:.9}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다. 교과목 소개 첫 화면으로 돌아가 주세요.</p>
    <a href="./">교육평가 교과목 소개로 이동</a>
  </div>
</body>
</html>
